an></text><line x1="1190.0" y1="250" x2="1140" y2="330" stroke="#666666" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="8 7"/><rect x="1365" y="105" width="300" height="145" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.1"/><text x="1515.0" y="147" class="small" text-anchor="middle">⑤ 分层与边缘辅助</text><text x="1515.0" y="187" class="small" text-anchor="middle"><tspan x="1515.0" dy="0">重组端—边—云流量</tspan><tspan x="1515.0" dy="30">和聚合时间尺度</tspan></text><line x1="1515.0" y1="250" x2="1450" y2="330" stroke="#666666" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="8 7"/><rect x="210" y="815" width="1380" height="80" rx="0" fill="#F3F3F3" stroke="#111111" stroke-width="1.8"/><text x="900" y="851" class="label" text-anchor="middle">统一评价：在相同目标精度下比较累计比特量、通信轮数、端到端时延与能耗</text><text x="900" y="882" class="small" text-anchor="middle">局部指标改善不等于系统总成本必然下降</text></svg>
