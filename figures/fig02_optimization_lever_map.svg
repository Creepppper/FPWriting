<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/>
  </marker>
  <marker id="arrow-small" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; fill: #203040; }
    .label { font-size: 28px; font-weight: 600; }
    .body { font-size: 24px; }
    .small { font-size: 21px; }
    .tiny { font-size: 18px; }
    .panel { font-size: 26px; font-weight: 700; }
    .metric { font-size: 22px; font-weight: 600; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="215" y="83" class="panel" text-anchor="middle" fill="#5D6B78" style="fill:#5D6B78">优化杠杆</text><text x="755" y="83" class="panel" text-anchor="middle" fill="#5D6B78" style="fill:#5D6B78">主要改变的通信要素</text><text x="1325" y="83" class="panel" text-anchor="middle" fill="#5D6B78" style="fill:#5D6B78">优先观察的指标与代价</text><rect x="70" y="125" width="300" height="115" rx="18" fill="#E8F1F8" stroke="#3973A8" stroke-width="3"/><text x="220" y="170" class="label" text-anchor="middle" fill="#3973A8" style="fill:#3973A8">时间 / 频率</text><text x="220" y="209" class="tiny" text-anchor="middle" fill="#203040" style="fill:#203040">本地多步更新 · 异步 · 事件触发</text><line x1="370" y1="183" x2="485" y2="183" stroke="#3973A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="485" y="125" width="540" height="115" rx="18" fill="#FFFFFF" stroke="#3973A8" stroke-width="2"/><text x="755" y="194" class="body" text-anchor="middle" fill="#203040" style="fill:#203040">减少或重排全局交互轮次 R</text><line x1="1025" y1="183" x2="1140" y2="183" stroke="#3973A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="125" width="390" height="115" rx="18" fill="#FFFFFF" stroke="#3973A8" stroke-width="2"/><text x="1335" y="194" class="small" text-anchor="middle" fill="#203040" style="fill:#203040">轮数 / 陈旧度 / 本地计算</text><rect x="70" y="275" width="300" height="115" rx="18" fill="#E5F4F2" stroke="#2B8C87" stroke-width="3"/><text x="220" y="320" class="label" text-anchor="middle" fill="#2B8C87" style="fill:#2B8C87">参与者 / 资源</text><text x="220" y="359" class="tiny" text-anchor="middle" fill="#203040" style="fill:#203040">客户端选择 · 调度 · 带宽功率分配</text><line x1="370" y1="333" x2="485" y2="333" stroke="#2B8C87" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="485" y="275" width="540" height="115" rx="18" fill="#FFFFFF" stroke="#2B8C87" stroke-width="2"/><text x="755" y="344" class="body" text-anchor="middle" fill="#203040" style="fill:#203040">改变每轮参与集合 Kₜ 与完成时间</text><line x1="1025" y1="333" x2="1140" y2="333" stroke="#2B8C87" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="275" width="390" height="115" rx="18" fill="#FFFFFF" stroke="#2B8C87" stroke-width="2"/><text x="1335" y="344" class="small" text-anchor="middle" fill="#203040" style="fill:#203040">时延 / 能耗 / 公平性 / 控制开销</text><rect x="70" y="425" width="300" height="115" rx="18" fill="#FFF1DE" stroke="#D48735" stroke-width="3"/><text x="220" y="470" class="label" text-anchor="middle" fill="#D48735" style="fill:#D48735">传输载荷</text><text x="220" y="509" class="tiny" text-anchor="middle" fill="#203040" style="fill:#203040">量化 · 稀疏化 · 剪枝 · 压缩感知</text><line x1="370" y1="483" x2="485" y2="483" stroke="#D48735" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="485" y="425" width="540" height="115" rx="18" fill="#FFFFFF" stroke="#D48735" stroke-width="2"/><text x="755" y="494" class="body" text-anchor="middle" fill="#203040" style="fill:#203040">降低单次下发或上传的比特量 Bₜ</text><line x1="1025" y1="483" x2="1140" y2="483" stroke="#D48735" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="425" width="390" height="115" rx="18" fill="#FFFFFF" stroke="#D48735" stroke-width="2"/><text x="1335" y="494" class="small" text-anchor="middle" fill="#203040" style="fill:#203040">累计比特 / 精度损失 / 编解码</text><rect x="70" y="575" width="300" height="115" rx="18" fill="#FAE9E9" stroke="#C65B5B" stroke-width="3"/><text x="220" y="620" class="label" text-anchor="middle" fill="#C65B5B" style="fill:#C65B5B">无线信道</text><text x="220" y="659" class="tiny" text-anchor="middle" fill="#203040" style="fill:#203040">空中计算 · 模拟聚合</text><line x1="370" y1="633" x2="485" y2="633" stroke="#C65B5B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="485" y="575" width="540" height="115" rx="18" fill="#FFFFFF" stroke="#C65B5B" stroke-width="2"/><text x="755" y="644" class="body" text-anchor="middle" fill="#203040" style="fill:#203040">把多用户上传与求和合并</text><line x1="1025" y1="633" x2="1140" y2="633" stroke="#C65B5B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="575" width="390" height="115" rx="18" fill="#FFFFFF" stroke="#C65B5B" stroke-width="2"/><text x="1335" y="644" class="small" text-anchor="middle" fill="#203040" style="fill:#203040">聚合时延 / 频谱 / 聚合误差</text><rect x="70" y="725" width="300" height="115" rx="18" fill="#EFECF8" stroke="#7666AF" stroke-width="3"/><text x="220" y="770" class="label" text-anchor="middle" fill="#7666AF" style="fill:#7666AF">聚合拓扑</text><text x="220" y="809" class="tiny" text-anchor="middle" fill="#203040" style="fill:#203040">边缘局部聚合 · 分层与边缘辅助</text><line x1="370" y1="783" x2="485" y2="783" stroke="#7666AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="485" y="725" width="540" height="115" rx="18" fill="#FFFFFF" stroke="#7666AF" stroke-width="2"/><text x="755" y="794" class="body" text-anchor="middle" fill="#203040" style="fill:#203040">重组端—边—云之间的跨层流量</text><line x1="1025" y1="783" x2="1140" y2="783" stroke="#7666AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="725" width="390" height="115" rx="18" fill="#FFFFFF" stroke="#7666AF" stroke-width="2"/><text x="1335" y="794" class="small" text-anchor="middle" fill="#203040" style="fill:#203040">两级流量 / 同步频率 / 边缘负载</text><rect x="285" y="850" width="1030" height="38" rx="18" fill="#F4F6F7" stroke="#B5BEC5" stroke-width="1"/><text x="800" y="878" class="small" text-anchor="middle" fill="#5D6B78" style="fill:#5D6B78">横向比较必须在相同目标精度和系统假设下核算总成本，五类方法可组合但不可直接按单一百分比排序。</text></svg>
